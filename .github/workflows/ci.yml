name: Java CI
on:
  push:
    branches: [master, 3.2.x]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MAVEN_OPTS: -Dmaven.artifact.threads=256 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        profile: [test-derby, test-h2]
    name: build (Java ${{ matrix.java }}, ${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Java JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - name: 'Cache Maven packages'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2
          key: cache-${{ matrix.java }}-${{ matrix.profile }}
          restore-keys: cache-${{ matrix.java }}-${{ matrix.profile }}
      # Random test order on master finds tests that depend on each other; the run id is the seed,
      # see the test order properties in the root pom for how to replay a run
      - name: 'Build with Maven'
        run: >-
          mvn -P${{ matrix.profile }} -B clean install --file pom.xml
          '-Dtest.method.order=org.junit.jupiter.api.MethodOrderer$Random'
          -Djunit.jupiter.execution.order.random.seed=${{ github.run_id }}
          -Dsurefire.runOrder=random -Dsurefire.runOrder.random.seed=${{ github.run_id }}
      - name: 'Remove snapshots before caching'
        run: find ~/.m2 -name '*SNAPSHOT' | xargs rm -Rf

  # Runs DynamicEnhancementSuite with entities that are not enhanced at build time,
  # so the enhancer agent has to enhance them when they are loaded. -Dtest keeps the
  # upstream modules from running their own tests, which the build job covers.
  dynamic-enhancer:
    runs-on: ubuntu-latest
    name: build (Java 21, test-dynamic-enhancer)
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Java JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'zulu'
          java-version: 21
      - name: 'Cache Maven packages'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2
          key: cache-21-test-dynamic-enhancer
          restore-keys: cache-21-test-dynamic-enhancer
      - name: 'Test with the dynamic enhancement agent'
        run: mvn -Ptest-dynamic-enhancer -B clean test -pl openjpa-persistence-jdbc -am -Dtest=DynamicEnhancementSuite -Dsurefire.failIfNoSpecifiedTests=false --file pom.xml
      - name: 'Remove snapshots before caching'
        run: find ~/.m2 -name '*SNAPSHOT' | xargs rm -Rf
